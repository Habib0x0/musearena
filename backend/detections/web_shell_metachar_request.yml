title: Shell Metacharacters In Web Request Path
id: 0b8f6c2e-5d4a-4b8e-8f1d-6a0c2e9b7d02
status: test
description: Request URL carries URL-encoded shell separators, a common command-injection probe.
author: MuseArena
date: 2026-10-27
tags:
  - attack.execution
  - attack.t1059
logsource:
  product: musearena
  service: apache
detection:
  selection:
    kind: http.request
    path|contains:
      - '%3B'
      - '%7C'
      - '%60'
      - '$('
  condition: selection
level: medium
